name: Build U-Boot

on:
  push:
    branches: [ xg-040g-md-support ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y \
            gcc-arm-none-eabi \
            device-tree-compiler \
            bison \
            flex \
            libssl-dev \
            bc
      
      - name: Build U-Boot
        run: |
          make an7581_nokia-xg-040g-md_defconfig
          make -j$(nproc)
      
      - name: Check build output
        run: |
          ls -lh u-boot.bin
          file u-boot.bin
          md5sum u-boot.bin
      
      - name: Upload U-Boot binary
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-xg-040g-md
          path: u-boot.bin
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: u-boot.bin
          body: |
            ## Nokia XG-040G-MD U-Boot
            
            ⚠️ **Experimental Build**
            
            ### Build Info
            - Commit: ${{ github.sha }}
            - Build Date: ${{ github.event.head_commit.timestamp }}
            
            ### Features
            - USB 3.0 support (2 ports)
            - HTTP Recovery mode
            - UBI partition layout
            
            ### ⚠️ Warning
            Flashing U-Boot can brick your device! Requires TTL serial adapter for recovery.
